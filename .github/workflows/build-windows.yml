# Build Windows (NSIS + portable) for Monetixa.
# Publishes installers to GitHub Releases (no Actions artifacts — avoids storage quota).
#
# Manual: Actions → Build Windows → Run workflow
# Tag:   git tag v0.1.4 && git push origin v0.1.4
name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare env for Next build + packaged app
        shell: bash
        run: cp .env.example .env.local

      - name: Build Windows (NSIS + portable)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Prepare update feed folder
        run: npm run updates:prepare

      - name: List release files
        shell: bash
        run: |
          echo "== release/ =="
          ls -lah release/ || true
          echo "== updates/ =="
          ls -lah updates/ || true

      # GitHub Releases storage (not Actions artifact quota)
      - name: Publish GitHub Release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Monetixa ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
            updates/.htaccess
            updates/README.txt
          body: |
            ## Windows
            - **Monetixa Setup x.y.z.exe** — instalador NSIS (recomendado, auto-update)
            - **Monetixa x.y.z.exe** — portable
            - **latest.yml** — feed de auto-update

            ## Auto-update
            1. Descarga Setup + `latest.yml` (+ `.blockmap` si existe)
            2. Súbelos a Hostinger → `public_html/monetixa/`
            3. Confirma `UPDATE_FEED_URL=https://sanbustv.io/monetixa`

            Nombres sin espacios (Hostinger): `Monetixa.Setup.x.y.z.exe`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish CI prerelease (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-ci
          name: Monetixa Windows CI build
          draft: false
          prerelease: true
          fail_on_unmatched_files: false
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
            updates/.htaccess
            updates/README.txt
          body: |
            Build manual desde Actions (prerelease continuo `windows-ci`).
            Descarga los `.exe` y `latest.yml` desde Assets.
            Para un release estable, publica un tag `v*`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
