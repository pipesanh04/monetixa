# Build Windows (NSIS + portable) for Monetixa.
# NSIS enables electron-updater auto-updates on Windows.
#
# Manual: Actions → Build Windows → Run workflow
# Tag:   git tag v0.1.3 && git push origin v0.1.3
name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows (NSIS + portable)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Prepare update feed folder
        run: npm run updates:prepare

      - name: List release artifacts
        shell: bash
        run: |
          echo "== release/ =="
          ls -lah release/ || true
          echo "== updates/ =="
          ls -lah updates/ || true

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: monetixa-windows-${{ github.ref_name }}
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30

      - name: Upload update feed
        uses: actions/upload-artifact@v4
        with:
          name: monetixa-updates-${{ github.ref_name }}
          path: updates/
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Monetixa ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          body: |
            ## Windows
            - **Monetixa Setup x.y.z.exe** — instalador NSIS (recomendado, auto-update)
            - **Monetixa x.y.z.exe** — portable

            ## Auto-update
            1. Descarga también `latest.yml` (+ `.blockmap` si existe)
            2. Sube el contenido de `updates/` a Hostinger → `public_html/monetixa/`
            3. Confirma `UPDATE_FEED_URL=https://sanbustv.io/monetixa`

            Seriales demo: `DEMO-SERIAL-2026`, `MBX-ALPHA-001`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
